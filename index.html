<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Сканер товаров</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>

  <style>
    :root {
      --bg: #0f1117;
      --surface: #1c1f2e;
      --card: #252840;
      --accent: #5b8af5;
      --accent2: #a78bfa;
      --success: #34d399;
      --warn: #fbbf24;
      --danger: #f87171;
      --text: #e8eaf6;
      --muted: #7c85b3;
      --border: #313557;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 4px 24px rgba(0,0,0,.45);
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    #app { display: flex; flex-direction: column; min-height: 100dvh; }

    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }

    .top-bar h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: .02em; }

    .top-bar .user-chip {
      display: flex; align-items: center; gap: 8px;
      background: var(--card); border-radius: 99px;
      padding: 6px 12px 6px 6px;
      font-size: .8rem; color: var(--muted);
      max-width: 180px; overflow: hidden;
    }

    .top-bar .user-chip img {
      width: 26px; height: 26px; border-radius: 50%; object-fit: cover;
    }

    .top-bar .user-chip span {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .content {
      flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: .75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--muted); margin-bottom: 14px;
      display: flex; align-items: center; gap: 7px;
    }

    .card-title .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); display: inline-block;
    }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      width: 100%; min-height: 54px;
      border: none; border-radius: var(--radius-sm);
      font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: opacity .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active { opacity: .75; transform: scale(.97); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-success { background: var(--success); color: #0a2e22; }
    .btn-danger { background: var(--danger); color: #2e0a0a; }
    .btn-sm { min-height: 42px; font-size: .9rem; }

    .btn-google {
      background: #fff; color: #3c4043;
      font-size: 1rem; font-weight: 600;
      border-radius: var(--radius-sm);
      min-height: 54px;
    }

    .btn-google img { width: 22px; height: 22px; }

    .field { margin-bottom: 12px; }

    .field label {
      display: block; font-size: .8rem; color: var(--muted);
      margin-bottom: 5px; font-weight: 600;
    }

    .field input, .field textarea {
      width: 100%; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text); font-size: 1rem; font-family: var(--font);
      padding: 12px 14px; outline: none;
      transition: border-color .15s;
    }

    .field input:focus, .field textarea:focus { border-color: var(--accent); }

    .field textarea { min-height: 80px; resize: vertical; }

    .field input::placeholder, .field textarea::placeholder { color: var(--muted); }

    #qr-reader {
      width: 100%;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: #000;
      display: none;
    }

    #qr-reader video { width: 100%; display: block; }

    #qr-reader__dashboard_section_csr button { display: none !important; }
    #qr-reader__status_span { display: none !important; }

    #qr-reader select {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 6px 10px; margin: 8px 0; width: 100%;
    }

    .barcode-result {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--success);
      border-radius: var(--radius-sm); padding: 12px 14px;
      margin-top: 10px;
    }

    .barcode-result .icon { font-size: 1.4rem; }

    .barcode-result .val {
      font-size: 1.1rem; font-weight: 700; color: var(--success);
      flex: 1; word-break: break-all;
    }

    #photo-preview {
      width: 100%; border-radius: var(--radius-sm);
      display: none; margin-bottom: 10px;
      max-height: 240px; object-fit: contain;
      background: #000;
    }

    .ocr-overlay {
      position: relative;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px;
      margin-top: 6px;
    }

    .ocr-progress {
      display: none; font-size: .85rem; color: var(--muted);
      text-align: center; padding: 10px 0;
    }

    .ocr-progress .bar {
      height: 4px; background: var(--border); border-radius: 99px;
      margin: 8px 0; overflow: hidden;
    }

    .ocr-progress .bar-fill {
      height: 100%; background: var(--accent2);
      border-radius: 99px;
      transition: width .3s;
      width: 0%;
    }

    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--card); border: 1px solid var(--border);
      border-radius: 99px; padding: 12px 22px;
      font-size: .9rem; font-weight: 600;
      box-shadow: var(--shadow);
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
      z-index: 999; white-space: nowrap;
      pointer-events: none;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.ok { border-color: var(--success); color: var(--success); }
    #toast.err { border-color: var(--danger); color: var(--danger); }
    #toast.inf { border-color: var(--accent); color: var(--accent); }

    #login-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100dvh; gap: 20px; padding: 32px 24px;
      background: var(--bg);
    }

    .login-logo { font-size: 3rem; margin-bottom: 8px; }
    .login-title { font-size: 1.6rem; font-weight: 800; text-align: center; }
    .login-sub { color: var(--muted); text-align: center; font-size: .95rem; max-width: 300px; }
    #login-screen .card { width: 100%; max-width: 360px; }

    .hidden { display: none !important; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    #sending-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.7);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; z-index: 9999;
    }

    #sending-overlay .spinner {
      width: 48px; height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
